<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>オンラインオリパ 画面モック</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@500;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* ===========================================================
   デザイン方針
   - 配色は「墨・朱・金・藍」。トレカの箔押しを想起させるが、
     グラデーションは演出Rankの表現にだけ使い、装飾には使わない。
   - 見出しは明朝、本文はゴシック。くじ引きの土着的な質感を出しつつ、
     数値情報はゴシックで読みやすさを優先する。
   - 残口数メーターを共通の構造要素とする。装飾ではなく在庫情報。
   =========================================================== */
:root{
  --sumi:#12141c;        /* base */
  --sumi-2:#1a1e2a;      /* surface */
  --sumi-3:#242938;      /* raised */
  --kinari:#f2efe7;      /* text */
  --kinari-dim:#9aa0b0;  /* muted text */
  --aka:#e2483f;         /* accent / 当たり */
  --kin:#c9a227;         /* レア */
  --ai:#3a6ea5;          /* 情報 */
  --midori:#3f8f6d;      /* 成功 */
  --line:#2e3344;
  --r:10px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--sumi);
  color:var(--kinari);
  font-family:"Zen Kaku Gothic New",system-ui,sans-serif;
  font-size:15px;line-height:1.7;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,.mincho{font-family:"Shippori Mincho B1",serif;font-weight:700;letter-spacing:.02em}

/* ---------- 全体レイアウト ---------- */
.app{display:grid;grid-template-columns:250px 1fr;min-height:100vh}
.rail{
  border-right:1px solid var(--line);background:var(--sumi-2);
  padding:22px 0 40px;position:sticky;top:0;height:100vh;overflow-y:auto;
}
.rail h1{font-size:17px;margin:0 20px 4px;line-height:1.4}
.rail .sub{margin:0 20px 20px;font-size:12px;color:var(--kinari-dim)}
.rail .group{margin:18px 0 6px;padding:0 20px;font-size:11px;color:var(--kinari-dim);letter-spacing:.08em}
.rail button{
  display:block;width:100%;text-align:left;background:none;border:0;color:var(--kinari);
  font:inherit;font-size:13.5px;padding:7px 20px;cursor:pointer;border-left:2px solid transparent;
}
.rail button:hover{background:#202533}
.rail button[aria-current="true"]{border-left-color:var(--aka);background:#202533;font-weight:700}
.rail button .id{color:var(--kinari-dim);font-size:11px;margin-right:7px}
.rail button:focus-visible{outline:2px solid var(--kin);outline-offset:-2px}

.stage{padding:32px 40px 80px;overflow-x:auto}
.stage-head{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;margin-bottom:6px}
.stage-head h2{font-size:22px;margin:0}
.stage-head .code{font-size:12px;color:var(--kinari-dim)}
.stage-note{color:var(--kinari-dim);font-size:13.5px;max-width:62ch;margin:0 0 26px}
.stage-note b{color:var(--kinari);font-weight:500}

/* ---------- スマホ枠 ---------- */
.phone{
  width:390px;border:1px solid var(--line);border-radius:26px;background:var(--sumi-2);
  overflow:hidden;box-shadow:0 24px 60px rgba(0,0,0,.45);
}
.phone .bar{
  height:30px;display:flex;align-items:center;justify-content:space-between;
  padding:0 16px;font-size:11px;color:var(--kinari-dim);border-bottom:1px solid var(--line);
}
.screen{height:720px;overflow-y:auto;position:relative}
.screen::-webkit-scrollbar{width:5px}
.screen::-webkit-scrollbar-thumb{background:var(--sumi-3);border-radius:3px}
.pad{padding:16px}

/* ---------- 汎用パーツ ---------- */
.appbar{
  display:flex;align-items:center;justify-content:space-between;gap:10px;
  padding:12px 16px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--sumi-2);z-index:5;
}
.appbar .title{font-family:"Shippori Mincho B1",serif;font-size:16px;font-weight:700}
.bal{font-size:12px;color:var(--kinari-dim);text-align:right;line-height:1.45}
.bal b{display:block;color:var(--kin);font-size:15px;font-weight:700}

.card{background:var(--sumi-3);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.thumb{height:120px;background:linear-gradient(135deg,#2b3350,#1a1e2a 60%);position:relative;display:flex;align-items:flex-end;padding:10px}
.thumb .rare{font-family:"Shippori Mincho B1",serif;font-size:26px;color:rgba(242,239,231,.22);position:absolute;top:8px;right:12px}
.tag{display:inline-block;font-size:11px;padding:2px 7px;border-radius:3px;border:1px solid currentColor;line-height:1.5}
.t-aka{color:var(--aka)} .t-kin{color:var(--kin)} .t-ai{color:var(--ai)} .t-dim{color:var(--kinari-dim)}

/* 残口数メーター：在庫の情報表現 */
.meter{display:flex;gap:2px;height:5px;margin:9px 0 5px}
.meter i{flex:1;background:var(--sumi);border-radius:1px}
.meter i.on{background:var(--kin)}
.meter-cap{display:flex;justify-content:space-between;font-size:11.5px;color:var(--kinari-dim)}
.meter-cap b{color:var(--kinari);font-weight:500}

.btn{
  display:block;width:100%;padding:13px;border:0;border-radius:var(--r);
  font:inherit;font-weight:700;font-size:15px;cursor:pointer;background:var(--aka);color:#fff;
}
.btn:focus-visible{outline:2px solid var(--kin);outline-offset:2px}
.btn.ghost{background:transparent;color:var(--kinari);border:1px solid var(--line)}
.btn.gold{background:var(--kin);color:#22200f}
.btn:disabled{background:var(--sumi-3);color:var(--kinari-dim);cursor:not-allowed}
.btn-row{display:flex;gap:10px;margin-top:12px}

.row{display:flex;justify-content:space-between;gap:12px;padding:11px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row .l{font-size:14px}
.row .s{font-size:11.5px;color:var(--kinari-dim)}
.num{font-variant-numeric:tabular-nums}

.sec{margin:22px 0 9px;font-family:"Shippori Mincho B1",serif;font-size:14.5px}
.notice{border-left:2px solid var(--ai);padding:9px 12px;background:#1a1e2a;font-size:12.5px;color:var(--kinari-dim);border-radius:0 4px 4px 0}
.notice b{color:var(--kinari);font-weight:500}

table.rate{width:100%;border-collapse:collapse;font-size:13px}
table.rate th,table.rate td{padding:8px 4px;border-bottom:1px solid var(--line);text-align:left}
table.rate th{font-weight:500;color:var(--kinari-dim);font-size:11.5px}
table.rate td.n{text-align:right;font-variant-numeric:tabular-nums}

/* ---------- 演出 ---------- */
.stagebox{
  height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:20px;position:relative;overflow:hidden;background:#0b0d14;
}
.orb{width:170px;height:170px;border-radius:50%;position:relative;display:grid;place-items:center;transition:box-shadow .4s}
.orb::after{
  content:"";position:absolute;inset:0;border-radius:50%;
  border:2px solid currentColor;animation:pulse 1.6s ease-out infinite;
}
@keyframes pulse{0%{transform:scale(.82);opacity:.9}100%{transform:scale(1.35);opacity:0}}
.orb .lbl{font-family:"Shippori Mincho B1",serif;font-size:15px;color:var(--kinari)}
.rank-normal{color:var(--ai);box-shadow:0 0 60px -10px var(--ai)}
.rank-chance{color:var(--aka);box-shadow:0 0 70px -6px var(--aka)}
.rank-fever{color:var(--kin);box-shadow:0 0 80px -4px var(--kin)}
.rank-rainbow{color:#fff;box-shadow:0 0 90px -2px #b06cf0}
.rank-rainbow::after{border-color:transparent;background:conic-gradient(#e2483f,#c9a227,#3f8f6d,#3a6ea5,#b06cf0,#e2483f);
  -webkit-mask:radial-gradient(circle,transparent 61%,#000 63%);mask:radial-gradient(circle,transparent 61%,#000 63%)}
.rank-pick{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;padding:0 16px}
.rank-pick button{background:var(--sumi-3);border:1px solid var(--line);color:var(--kinari);font:inherit;font-size:12px;padding:6px 11px;border-radius:99px;cursor:pointer}
.rank-pick button[aria-pressed="true"]{border-color:var(--kin);color:var(--kin)}
.skip{position:absolute;top:14px;right:14px;background:rgba(0,0,0,.4);border:1px solid var(--line);color:var(--kinari-dim);font:inherit;font-size:12px;padding:6px 12px;border-radius:99px;cursor:pointer}

/* 10連結果グリッド */
.grid10{display:grid;grid-template-columns:repeat(5,1fr);gap:7px}
.cell{aspect-ratio:5/7;border-radius:5px;background:var(--sumi-3);border:1px solid var(--line);display:flex;align-items:flex-end;justify-content:center;padding:5px;font-size:10.5px;color:var(--kinari-dim);text-align:center}
.cell.hit{border-color:var(--kin);background:linear-gradient(160deg,#3a3320,#1a1e2a);color:var(--kin)}
.cell.top{border-color:#b06cf0;background:linear-gradient(160deg,#3a2748,#1a1e2a);color:#dcbcff}

/* ---------- 管理画面（PC想定） ---------- */
.desk{border:1px solid var(--line);border-radius:8px;background:var(--sumi-2);overflow:hidden;max-width:1000px}
.desk .top{display:flex;justify-content:space-between;align-items:center;padding:12px 18px;border-bottom:1px solid var(--line);font-size:13px}
.desk .body{padding:20px}
.form{display:grid;grid-template-columns:170px 1fr;gap:12px 18px;align-items:center;font-size:13.5px}
.form label{color:var(--kinari-dim)}
.inp{background:var(--sumi);border:1px solid var(--line);color:var(--kinari);border-radius:5px;padding:8px 10px;font:inherit;font-size:13.5px;width:100%}
table.grid{width:100%;border-collapse:collapse;font-size:13px}
table.grid th,table.grid td{padding:9px 8px;border-bottom:1px solid var(--line);text-align:left}
table.grid th{color:var(--kinari-dim);font-weight:500;font-size:11.5px}
table.grid td.n{text-align:right;font-variant-numeric:tabular-nums}
.ok{color:var(--midori)} .warn{color:var(--aka)}

@media (max-width:820px){
  .app{grid-template-columns:1fr}
  .rail{position:static;height:auto;border-right:0;border-bottom:1px solid var(--line)}
  .stage{padding:22px 18px 60px}
  .phone{width:100%;max-width:390px}
}
@media (prefers-reduced-motion:reduce){
  .orb::after{animation:none;opacity:.5;transform:scale(1.1)}
}
</style>
</head>
<body>
<div class="app">

<nav class="rail">
  <h1>オンラインオリパ</h1>
  <p class="sub">画面モック v0.1 / 要件定義書 v2.3 準拠</p>

  <p class="group">利用者画面</p>
  <button data-s="s111" aria-current="true"><span class="id">111</span>ガチャ一覧</button>
  <button data-s="s112"><span class="id">112</span>ガチャ詳細</button>
  <button data-s="s113"><span class="id">113</span>演出再生</button>
  <button data-s="s114"><span class="id">114</span>抽選結果（10連）</button>
  <button data-s="s121"><span class="id">121</span>ポイント購入</button>
  <button data-s="s122"><span class="id">122</span>ポイント履歴</button>
  <button data-s="s132"><span class="id">132</span>獲得カード</button>
  <button data-s="s133"><span class="id">133</span>発送申請</button>
  <button data-s="s141"><span class="id">141</span>提供割合・特商法</button>

  <p class="group">管理画面</p>
  <button data-s="s212"><span class="id">212</span>ガチャ編集</button>
  <button data-s="s241"><span class="id">241</span>発送管理</button>
  <button data-s="s231"><span class="id">231</span>ポイント調整の承認</button>
</nav>

<main class="stage" id="stage"></main>
</div>

<script>
/* ダミーデータ。実データではない */
const G = {name:"蒼海の覇者 第7弾", cost:4000, refund:2800, total:1000, left:312};

const meter = (left,total,seg=24)=>{
  const on = Math.max(1, Math.round(left/total*seg));
  return `<div class="meter">${Array.from({length:seg},(_,i)=>`<i class="${i<on?'on':''}"></i>`).join("")}</div>
  <div class="meter-cap"><span>残り <b>${left}</b> 口 / 全${total}口</span><span>1口 ${G.cost.toLocaleString()}pt</span></div>`;
};

const appbar = (t)=>`<div class="appbar"><span class="title">${t}</span>
  <span class="bal">保有ポイント<b class="num">32,800</b></span></div>`;

const phone = (inner)=>`<div class="phone"><div class="bar"><span>9:41</span><span>オリパ</span></div>
  <div class="screen">${inner}</div></div>`;

/* ---------------- 画面定義 ---------------- */
const S = {};

S.s111 = {
  t:"ガチャ一覧", note:"残口数を各カードに常時表示する。<b>売り切れ間近が一目でわかること</b>が回転率に効くため、サムネイルより在庫の視認性を優先した。",
  html: phone(appbar("オリパ一覧") + `<div class="pad">
    <div class="card" style="margin-bottom:14px">
      <div class="thumb"><span class="rare">SS</span><span class="tag t-aka">残りわずか</span></div>
      <div class="pad">
        <div class="mincho" style="font-size:16px">蒼海の覇者 第7弾</div>
        <p class="s" style="margin:4px 0 0;color:var(--kinari-dim);font-size:12px">最高賞：SS賞「深淵のリヴァイア」1口封入</p>
        ${meter(312,1000)}
      </div>
    </div>
    <div class="card" style="margin-bottom:14px">
      <div class="thumb" style="background:linear-gradient(135deg,#3a2a2a,#1a1e2a 60%)"><span class="rare">S</span></div>
      <div class="pad">
        <div class="mincho" style="font-size:16px">輝光アリーナ 廉価版</div>
        <p class="s" style="margin:4px 0 0;color:var(--kinari-dim);font-size:12px">1口 1,000pt / ハズレ時 700pt還元</p>
        ${meter(1840,2000)}
      </div>
    </div>
    <div class="card">
      <div class="thumb" style="background:linear-gradient(135deg,#2a3a30,#1a1e2a 60%)"><span class="rare">A</span></div>
      <div class="pad">
        <div class="mincho" style="font-size:16px">旧世代 復刻セレクション</div>
        <p class="s" style="margin:4px 0 0;color:var(--kinari-dim);font-size:12px">絶版カード中心の構成</p>
        ${meter(94,500)}
      </div>
    </div>
  </div>`)
};

S.s112 = {
  t:"ガチャ詳細", note:"提供割合の表示は法令上の要求（NF-L01）。<b>引くボタンより上に置き、折りたたまない。</b>ハズレ枠も1行として明示する。",
  html: phone(appbar("蒼海の覇者 第7弾") + `<div class="pad">
    <div class="card"><div class="thumb" style="height:150px"><span class="rare">SS</span></div></div>
    <div style="margin-top:14px">${meter(312,1000)}</div>

    <p class="sec">封入内容と提供割合</p>
    <table class="rate">
      <tr><th>賞</th><th>カード</th><th class="n" style="text-align:right">口数</th><th class="n" style="text-align:right">割合</th></tr>
      <tr><td><span class="tag t-kin">SS</span></td><td>深淵のリヴァイア</td><td class="n">1</td><td class="n">0.10%</td></tr>
      <tr><td><span class="tag t-kin">S</span></td><td>白銀の航跡 ほか</td><td class="n">5</td><td class="n">0.50%</td></tr>
      <tr><td><span class="tag t-aka">A</span></td><td>海淵シリーズ</td><td class="n">30</td><td class="n">3.00%</td></tr>
      <tr><td><span class="tag t-ai">B</span></td><td>汎用レア</td><td class="n">120</td><td class="n">12.00%</td></tr>
      <tr><td><span class="tag t-dim">ハズレ</span></td><td>2,800pt還元</td><td class="n">844</td><td class="n">84.40%</td></tr>
    </table>

    <p class="notice" style="margin-top:14px">ハズレの場合、消費した4,000ptの70%にあたる<b>2,800pt</b>を還元します。還元ポイントはガチャの購入にのみ使用でき、<b>現金への交換はできません</b>。演出の派手さは当選を示すものではありません。</p>

    <div class="btn-row"><button class="btn">1口 引く</button><button class="btn gold">10口 引く</button></div>
    <p style="font-size:11.5px;color:var(--kinari-dim);text-align:center;margin-top:8px">消費 4,000pt / 40,000pt</p>
  </div>`)
};

S.s113 = {
  t:"演出再生", note:"APIの応答を受け取ってから再生を開始する（R-03）。動画が再生できない端末では静止画に自動で切り替える（F-135）。下のボタンで4段階のRankを切り替えられる。",
  html:`<div class="phone"><div class="bar"><span>9:41</span><span>オリパ</span></div>
    <div class="screen" style="padding:0">
      <div class="stagebox" style="height:720px">
        <button class="skip">スキップ</button>
        <div class="orb rank-chance" id="orb"><span class="lbl" id="orbLbl">チャンス</span></div>
        <p style="color:var(--kinari-dim);font-size:12.5px;margin:0">開封しています</p>
        <div class="rank-pick" id="ranks" style="position:absolute;bottom:26px">
          <button data-r="normal">通常</button>
          <button data-r="chance" aria-pressed="true">チャンス</button>
          <button data-r="fever">フィーバー</button>
          <button data-r="rainbow">レインボー</button>
        </div>
      </div>
    </div></div>`
};

S.s114 = {
  t:"抽選結果（10連）", note:"10本の動画を順に流さず、<b>最上位Rankの演出を1本だけ再生してから結果を一覧表示</b>する（F-136）。ハズレ枠はカードにならないため、10連でも実物は数枚しか出ない。",
  html: phone(appbar("結果") + `<div class="pad">
    <p class="sec" style="margin-top:4px">10口の結果</p>
    <div class="grid10">
      <div class="cell top">SS賞</div>
      <div class="cell">2,800pt</div>
      <div class="cell">2,800pt</div>
      <div class="cell hit">B賞</div>
      <div class="cell">2,800pt</div>
      <div class="cell">2,800pt</div>
      <div class="cell">2,800pt</div>
      <div class="cell hit">B賞</div>
      <div class="cell">2,800pt</div>
      <div class="cell">2,800pt</div>
    </div>
    <div style="margin-top:18px">
      <div class="row"><span class="l">消費ポイント</span><span class="num">40,000pt</span></div>
      <div class="row"><span class="l">還元ポイント<span class="s"> ハズレ8口</span></span><span class="num" style="color:var(--kin)">+22,400pt</span></div>
      <div class="row"><span class="l">獲得カード</span><span class="num">3枚</span></div>
    </div>
    <p class="notice" style="margin-top:14px">獲得したカードはマイページに保管されます。発送のご依頼は<b>10枚以上でまとめると送料が無料</b>になります。</p>
    <div class="btn-row"><button class="btn ghost">個別の演出を見る</button><button class="btn">もう一度引く</button></div>
  </div>`)
};

S.s121 = {
  t:"ポイント購入", note:"有効期限を購入前に明示する（NF-L02c）。金額プランは横並びにせず、<b>単価が同一であること</b>が読み取れる縦並びにした。",
  html: phone(appbar("ポイント購入") + `<div class="pad">
    <p class="notice">購入したポイントの有効期限は<b>180日</b>です。期限を過ぎたポイントは失効します。有効期限の延長は行いません。</p>
    <p class="sec">購入プラン</p>
    ${[[1000,1000],[5000,5000],[10000,10000],[30000,30000],[50000,50000]].map(([p,y])=>`
      <div class="row"><span class="l"><b class="num">${p.toLocaleString()}</b> pt<span class="s"> 有効期限 2027-02-27</span></span>
      <span class="num" style="color:var(--kin)">¥${y.toLocaleString()}</span></div>`).join("")}
    <p class="sec">支払い方法</p>
    <div class="row"><span class="l">クレジットカード</span><span class="s">決済代行を経由します</span></div>
    <button class="btn" style="margin-top:16px">10,000pt を購入する</button>
    <p style="font-size:11.5px;color:var(--kinari-dim);margin-top:10px">1pt = 1円。ポイントの払い戻しはできません。20歳未満の方は月間の購入上限が適用されます。</p>
  </div>`)
};

S.s122 = {
  t:"ポイント履歴", note:"有償と還元を分けて表示する。ロット管理の実装により<b>失効予定日と金額を先に見せられる</b>のが利点で、失効直前の問い合わせを減らす。",

/* ---------------- 表示制御 ---------------- */
const stage = document.getElementById("stage");
const btns = [...document.querySelectorAll(".rail button")];

function show(key){
  const s = S[key];
  stage.innerHTML = `<div class="stage-head"><h2>${s.t}</h2><span class="code">SCR-${key.slice(1)}</span></div>
    <p class="stage-note">${s.note}</p>${s.html}`;
  btns.forEach(b=>b.setAttribute("aria-current", b.dataset.s===key ? "true":"false"));
  if(key==="s113") bindRanks();
}
btns.forEach(b=>b.addEventListener("click",()=>show(b.dataset.s)));

function bindRanks(){
  const orb=document.getElementById("orb"), lbl=document.getElementById("orbLbl");
  const names={normal:"通常",chance:"チャンス",fever:"フィーバー",rainbow:"レインボー"};
  document.querySelectorAll("#ranks button").forEach(b=>{
    b.addEventListener("click",()=>{
      document.querySelectorAll("#ranks button").forEach(x=>x.setAttribute("aria-pressed","false"));
      b.setAttribute("aria-pressed","true");
      orb.className = "orb rank-"+b.dataset.r;
      lbl.textContent = names[b.dataset.r];
    });
  });
}
show("s111");
</script>
